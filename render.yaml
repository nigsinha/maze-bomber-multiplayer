services:
  - type: web
    name: maze-bomber-multiplayer
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_PATH
        value: /var/data/database.sqlite
    disk:
      name: maze-bomber-data
      mountPath: /var/data
      sizeGB: 1
